# Frontend CI — the landing app and its Android target.
#
# The backend keeps its own workflows in `backend/jovi-mall/.github/workflows`,
# including the two suites MOBILE-APP-PLAN.md names (`test:messaging-login` and
# `test:mobile-auth`). They are not duplicated here: this repository cannot run
# them, and a copy would drift.
#
# ⚠ PARTLY UNVERIFIED. The web job was corrected on 2026-09-13 against a real
#   local build; the ANDROID job below has still never run and was written from
#   the commands in MOBILE-APP-PLAN.md rather than from a green pipeline. Treat an
#   Android failure as a bug in this file until proven otherwise.
#
# ── The web build needs a reachable API ──────────────────────────────────────
#
# `npm run build` is not hermetic: `/pricing` refuses to publish without real
# prices, so the build FAILS when nothing answers. There is no offline fallback,
# and adding one would mean shipping invented prices — which is the thing that
# check exists to prevent.
#
# ⚠ THE API URL NO LONGER COMES FROM A SECRET, AND PASSING ONE WOULD NOW BE A BUG.
#   This job used to set `NEXT_PUBLIC_API_URL` from `secrets.NEXT_PUBLIC_API_URL`,
#   because `.env.production` was git-ignored and CI had no way to learn the host.
#   That file is committed as of 2026-09-13, and a shell environment variable
#   OVERRIDES it — Next's loader never replaces something already in process.env.
#   So a stale or empty secret would silently win over the committed value, and the
#   build would either fail or succeed against the wrong host. The committed file
#   is now the single source, which is also what the Dockerfile relies on.
#
#   https://api.wi-mall.com is public and was answering 200 on /api/health when
#   this was written, so no credential is needed to reach it from a GitHub runner.
name: CI

on:
  push:
    # `production` is included so a direct push to the release branch is still
    # checked. It is normally branched from main, which is checked anyway.
    branches: [main, production]
  pull_request:

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # ⚠ BLOCKING, AND IT WAS NOT ON 2026-09-13. It reported 135 errors and 15,261
      #   warnings that day, so it was added non-blocking to avoid a pipeline that was
      #   red on arrival. All of it is now resolved and the gate is on, which is the
      #   point — a lint step that cannot fail is decoration.
      #
      #   What the numbers actually were: 76 errors and 15,256 warnings came from
      #   eslint reading `android/`, where `cap sync` deposits the MINIFIED web build
      #   in three places. Minified code trips the same rules endlessly. Ignoring the
      #   native projects left 59 real findings, and those were fixed — including two
      #   genuine bugs the noise had buried: `useTranslations` called after an early
      #   return in two screens (a rules-of-hooks violation that can crash when data
      #   arrives), and a Dashboard link that resolved to "https://undefined" for any
      #   session without a role.
      #
      #   Six exceptions remain as `eslint-disable-next-line` with written reasons:
      #   two where the rule is simply wrong about `window.location.href`, and four
      #   deferred refactors. None is a blanket rule-off.
      - name: Lint
        run: npm run lint
      # No `env:` block. The host comes from the committed `.env.production`, which
      # is the same file the Dockerfile builds from — so this step and the real
      # image are configured identically, and there is one place to change it.
      - name: Build (web)
        run: npm run build

  android:
    name: Android release
    runs-on: ubuntu-latest
    # The web build is the cheaper signal and shares every type error, so there
    # is no point spending an Android toolchain on a branch that fails it.
    needs: web
    # ⚠ NOT ON `production`. That branch exists to release the WEB container, and
    #   a store release is a separate, deliberate act with its own signing keys —
    #   so every web deploy would otherwise pay for an Android build nobody asked
    #   for. PR and main behaviour is unchanged.
    if: github.ref != 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # `NATIVE_API_URL` is deliberately separate from NEXT_PUBLIC_API_URL —
      # see MOBILE-APP-PLAN.md. For a CI build it is the production API.
      - name: Static export
        env:
          NATIVE_API_URL: ${{ secrets.NATIVE_API_URL }}
        run: npm run build:native

      - run: npx cap sync android

      # Restores the keystore from a base64 secret. Written outside the workspace
      # so a stray `actions/upload-artifact` on the repo cannot pick it up.
      #
      # 🔴 THE MISSING `if:` IS THE WHOLE FIX, AND IT IS WHY THIS FILE NEVER RAN.
      #    This step used to carry `if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}`.
      #    The `secrets` context is NOT available in an `if:` expression — only in
      #    `env:`, `with:` and job-level `secrets:`. GitHub rejects the ENTIRE
      #    workflow file for it, so every run failed before starting, with
      #    "This run likely failed because of a workflow file issue" and no logs at
      #    all. Four runs failed that way, the oldest seven days before this fix, and
      #    the file's own header said it had "never run" — which was the symptom, not
      #    an accident of timing.
      #
      #    ⚠ IT IS NOT A SYNTAX ERROR AND NO LOCAL CHECK CATCHES IT. The YAML parses
      #      perfectly; it is a rejected *expression context*. Validating this file
      #      with a YAML parser says it is fine, which is exactly how it survived.
      #      The cheap check is the one that found it: look at whether the run is
      #      listed under its workflow NAME or under its FILENAME — GitHub shows the
      #      filename when the file itself was refused.
      #
      #    The secret has to reach the shell through `env:` and be tested there.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 set - the APK will be built UNSIGNED."
            echo "build.gradle leaves the signing config off rather than falling back"
            echo "to the debug key, so this still proves the app compiles."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "Keystore restored."

      - name: Assemble release
        env:
          WI_MALL_KEYSTORE: ${{ runner.temp }}/release.keystore
          WI_MALL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WI_MALL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WI_MALL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        # Unsigned when the secrets are absent (a fork's PR, for instance) —
        # build.gradle leaves the signing config off rather than falling back to
        # the debug key, so this still proves the app compiles.
        run: ./gradlew assembleRelease

      # ⚠ A GLOB, BECAUSE THE FILENAME DEPENDS ON WHETHER SIGNING SECRETS EXIST.
      #   An unsigned release build is `app-release-unsigned.apk`, not
      #   `app-release.apk` — app/build.gradle applies no release signingConfig when
      #   WI_MALL_KEYSTORE* are absent (`canSignRelease` is false), which is
      #   deliberate: it refuses to fall back to the debug key. So with no secrets
      #   set, gradle succeeds and writes a name this step was not looking for, and
      #   the job failed at UPLOAD with "No files were found" while the build itself
      #   was fine. Measured on run 34739823284.
      #
      #   `if-no-files-found: error` is kept on purpose: a release build that
      #   produces no APK at all should still fail loudly.
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
